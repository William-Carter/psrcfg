exec universal
exec sla

// Settings
speedrun_save prestart
sv_autosave 0
plugin_load sar


// Aliases
alias 02snap "sensitivity 5446.7218; smf"
alias 06snap "toggle sensitivity 1e29 7345.454 7480; smf"
alias 18snap1 "toggle sensitivity 9e16 3243; smf"
alias 18snap2 "toggle sensitivity 3e11 3181.818; smf"

alias +inf "+strafe; sensitivity 9e99"
alias -inf "-strafe; sensitivity 1"

alias startrun "speedrun_start; sar_achievement_reset 12; sar_achievement_reset 14"


// Binds
bind mouse4 +inf
bind y "save quick; load quick; sst_portal_resetisg; load quick"

bind tab 02snap
bind 6 06snap

bind x +attack

bind v sl300
bind c sl30
bind b sl80

bind r "load hard"
bind z "save hard"
bind 2 "load glitch"
bind f1 "save runisg"
bind f2 "load runisg"
bind f3 "save 15hard"
bind f4 "load 15hard"

unbind t
bind p startrun
bind f12 startrun