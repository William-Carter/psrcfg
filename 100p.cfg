exec universal
exec sla

// Settings
plugin_load sarspecial
speedrun_save prestart

// Aliases

alias sr02 "save r02"
alias sr04 "save r04"
alias sr06 "save r06"
alias sr08 "save r08"
alias sr09 "save r09"
alias sr10 "save r10"
alias sr11 "save r11"
alias sr13 "save r13"
alias sr14 "save r14"
alias sr15 "save r15"
alias sr16 "save r16"
alias sr17 "save r17"
alias sr18 "save r18"
alias sr19 "save r19"
alias sre00 "save re00"
alias sre01 "save re01"
alias sre02 "save re02"
alias srisg "save risg"

alias lr02 "load r02"
alias lr04 "load r04"
alias lr06 "load r06"
alias lr08 "load r08"   
alias lr09 "load r09"
alias lr10 "load r10"
alias lr11 "load r11"
alias lr13 "load r13"
alias lr14 "load r14"
alias lr15 "load r15"
alias lr16 "load r16"
alias lr17 "load r17"
alias lr18 "load r18"
alias lr19 "load r19"
alias lre00 "load re00"
alias lre01 "load re01"
alias lre02 "load re02"
alias lrisg "load risg"

alias numpad_saves "bind f1 sr02; bind f2 sr04; bind f3 sr06; bind f4 sr08; bind f5 sr09; bind f6 sr10; bind f7 sr11; bind f8 sr19; bind f9 sre00; bind f10 sre01; bind f11 sre02; bind f12 srisg; bind 9 sr15; bind 0 sr17"
alias numpad_loads "bind f1 lr02; bind f2 lr04; bind f3 lr06; bind f4 lr08; bind f5 lr09; bind f6 lr10; bind f7 lr11; bind f8 lr19; bind f9 lre00; bind f10 lre01; bind f11 lre02; bind f12 lrisg; bind 9 lr15; bind 0 lr17"

bind home numpad_saves
bind end numpad_loads

numpad_saves

alias 02snap "sensitivity 5446.7218; smf"
alias 04snap "toggle sensitivity 1e29 4954.5454 1164.725; smf"
alias 06snap "toggle sensitivity 1e29 7081.81818 7671.3636; smf"
alias 08infrontsnap "toggle sensitivity 2e12 5071.704545; smf"
alias 13snap "toggle sensitivity 628.005909 3607.1363; smf"
alias 14snap "toggle sensitivity 162.5477272727273 26.363636; smf"
alias 15snap "sensitivity 4125.909090; smf"

alias 17snap "toggle sensitivity 1e29 5778.70454545 516.07318; smf"
alias 17lpsnap "toggle sensitivity 1e29 1766.8182 3298.1818; smf"

alias +inf "+strafe; sensitivity 9e99"
alias -inf "-strafe; sensitivity 1"

alias reset4as "echo ach#PORTAL_RESET#"

alias startrun "sar_full_game_reset; speedrun_start; reset4as"


// Binds
bind 2 "load glitch"
bind v "save glitch; load glitch; fps_max 300"
bind c "save glitch; load glitch; fps_max 30"
bind y "save quick; load quick; sst_portal_resetisg; load quick"
bind z "save hard"
bind r "load hard"
bind tab 02snap
bind 8 06snap
bind 1 04snap
bind b 08infrontsnap
bind 3 13snap
bind 4 14snap
bind 5 15snap
bind 6 17snap
bind 7 17lpsnap
bind mouse4 +inf

unbind t
bind p startrun


