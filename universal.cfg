// This file is for binds, settings and aliases that are relevant everywhere

// Settings
demo_interplimit 999999
speedrun_dir ./demos/
fov_desired 90
m_rawinput 1
cl_showpos 1
gl_clear 1
sv_max_queries_window -1
sv_max_queries_sec 100
volume 0.1


// Aliases
alias sens "sensitivity 1; sst_mouse_factor 1"
alias lowsens "sensitivity 0.001"
alias smf "sst_mouse_factor 100"

// Binds
unbindall
bind w +forward
bind s +back
bind a +moveleft
bind d +moveright
bind e +use
bind shift +duck
bind alt toggle_duck
bind f "save quick"
bind g "load quick"
bind h "load quick01"
bind ctrl noclip
bind q sens
bind z lowsens
bind t speedrun_start
bind mouse1 +attack
bind mouse2 +attack2
bind mwheelup +jump
bind mwheeldown +jump
bind space +jump
bind mouse5 +strafe