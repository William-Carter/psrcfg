exec universal
exec inf

// Settings
speedrun_save prestart


// Aliases
alias 02vag1 "toggle sensitivity 1e29 1386.8547; smf"

alias 11vag1 "toggle sensitivity 2e17 2341.6681812; smf"

alias 15vag1 "toggle sensitivity 9e16 2341.6681812; smf"

alias 16vag1 "sensitivity 424.7136364; smf"

alias 17seamshot "toggle sensitivity 1e29 294.54545; smf"
alias 17vag1 "sensitivity 8606.43177; smf"

alias 18vag1 "toggle sensitivity 1e29 2167.6114; smf"

alias 19vag1 "toggle sensitivity 1e29 541.29545; smf"
alias 19vag2 "toggle sensitivity 5e16 1356.5455; smf"

alias e00vag1 "toggle sensitivity 6e18 1356.5455; smf"

// Setup Binds
alias 02setup "bind tab 02vag1; unbind r"
alias 11setup "bind tab 11vag1; unbind r"
alias 15setup "bind tab 15vag1; unbind r"
alias 16setup "bind tab 17vag1; bind r 16vag1"
alias 17setup "bind tab 17seamshot; bind r 17vag1"
alias 18setup "bind tab pause; unbind 18vag1; sv_player_funnel_into_portals 0"
alias 19setup "bind tab 19vag1; bind r 19vag2; sv_player_funnel_into_portals 1"
alias e00setup "bind tab e00vag1; unbind r"


// Binds
bind f1 02setup
bind f2 11setup
bind f3 15setup
bind f4 16setup
bind f5 17setup
bind f6 18setup
bind f7 19setup
bind f8 e00setup


bind mouse5 +inf