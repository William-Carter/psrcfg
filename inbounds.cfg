exec universal
exec inf
exec sla

// Settings
speedrun_save prestart
sv_autosave 0

// Aliases
alias saveisg "save isg"
alias loadisg "load isg"
alias 02snap1 "sensitivity 3e23; smf"
alias 02vag1 "toggle sensitivity 1e29 6794.9636; smf"
alias 13snap1 "toggle sensitivity 1e29 3204.7508 1227.2228; smf"
alias 13vag1 "toggle sensitivity 4e13 424.67178; smf"
alias 15vag1 "toggle sensitivity 9e16 2341.6681812; smf"
alias 17vag1 "toggle sensitivity 9e14 7757.2046; smf"
alias 19vag1 "toggle sensitivity 6e18 424.7; smf"
alias e02vag1 "toggle sensitivity 3e19 5e16; smf"
alias e02vag2 "toggle sensitivity 1e29 1704.0908; smf"
alias clb "unbind tab; unbind r; unbind z"
alias 30fps "fps_max 30"
// 00
alias 00setup "clb; bind z saveisg; bind r loadisg"
// 02
alias 02setup "clb; bind tab 02snap1; bind r 02vag1"

// 13
alias 13setup "clb; bind r 13snap1; bind tab 13vag1"
// 15->17
alias 15setup "clb; bind r 15vag1; bind tab 17vag1; bind z 30fps"
// 19->e02
alias 19setup "clb; bind z 19vag1; bind r e02vag1; bind tab e02vag2"
alias startrun "speedrun_start; 00setup"

// Binds
bind f1 00setup
bind f2 02setup
bind f3 13setup
bind f4 15setup
bind f5 19setup

bind f12 startrun
bind t startrun
bind y "save quick; load quick; sst_portal_resetisg; load quick"
bind c sl30
bind v sl300
bind 2 "load glitch"
bind 5 "fps_max 300"
bind 3 -duck
bind mouse4 +inf