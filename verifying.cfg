plugin_load spt
spt_ihud 1
spt_ihud_y 98
closecaption 1
developer 1
alias developer ""
bind h "demo_gototick 0"
bind j "demo_timescale 0.1"
bind k "demo_timescale 1"
bind l "demo_timescale 4"
bind semicolon "demo_timescale 8"
bind space "demo_togglepause"
bind i "toggle spt_cam_control 0 1"
bind o "toggle spt_overlay 0 1"


bind m "toggle demo_debug 1 0;toggle con_filter_enable 1 0; con_filter_text dem_consolecmd"
