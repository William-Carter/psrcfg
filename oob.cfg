exec universal
exec sla

// Settings
speedrun_save prestart
sv_autosave 0


// Aliases
alias 02snap "sensitivity 5446.7218; smf"
alias 06snap "toggle sensitivity 1e29 7345.454 7480; smf"
alias 06snap2 "toggle sensitivity 1e29 7081.81818 7671.3636; smf"
alias 09setup1 "toggle sensitivity 1e29 8181.81818; smf"
alias 09snap1 "toggle sensitivity 3280.8 1941; smf"
alias 15snap1 "sensitivity 3e13; smf"
alias 18snap1 "toggle sensitivity 9e16 3243; smf"
alias 18snap2 "toggle sensitivity 3e11 3181.818; smf"

alias 08infrontsnap "toggle sensitivity 2e12 5071.704545; smf"

alias +inf "+strafe; sensitivity 9e99"
alias -inf "-strafe; sensitivity 1"

alias startrun "speedrun_start; fps_max 300"

// Binds
bind mouse4 +inf
bind y "save quick; load quick; sst_portal_resetisg; load quick"

bind tab 02snap
bind 6 06snap2
bind 7 08infrontsnap
bind r 18snap1
bind 3 18snap2
bind 1 15snap1
bind 0 09setup1

bind x +attack
bind 4 +inf
bind 5 "-inf; fps_max 80"

bind v sl300
bind c sl30
bind b sl80

bind 2 "load glitch"

bind f12 startrun
bind t startrun



