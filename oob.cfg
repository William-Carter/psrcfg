exec universal
exec sla

// Settings
speedrun_save prestart
sv_autosave 0


// Aliases
alias 02snap "sensitivity 5446.7218; smf"
alias 06snap "toggle sensitivity 1e29 7345.454 7480; smf"
alias 18snap1 "toggle sensitivity 9e16 3243; smf"
alias 18snap2 "toggle sensitivity 3e11 3181.818; smf"

alias +inf "+strafe; sensitivity 9e99"
alias -inf "-strafe; sensitivity 1"


// Binds
bind mouse4 +inf

bind tab 02snap
bind 6 06snap
bind r 18snap1
bind 3 18snap2

bind x +attack
bind 4 +inf
bind 5 -inf

bind v sl300
bind c sl30
bind b sl80

bind 2 "load glitch"



